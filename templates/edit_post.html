{% extends 'base.html' %}
{% block title %} Editar Post {% endblock %}

{% block content %}
<div class="column is-offset-3 is-6">
    <h1 class="title">Editar publicacion</h1>

    <form action="" method="POST">
        <div class="field">
            <label class="label">Título</label>
            <div class="control">
                <input class="input" type="text" name="title" value="{{ post.title }}">
            </div>
        </div>

        <div class="field">
            <label class="label">Contenido</label>
            <div class="control">
                <textarea class="textarea" name="content">{{ post.content }}</textarea>
            </div>
        </div>

        <div class="field">
            <label class="label">Categoria</label>
            <div class="control">
                <div class="select">
                    <select name="category_id">
                        {% for cat in categories %}
                            <option value="{{ cat.id }}" {% if cat.id == post.category_id %}selected{% endif %}>
                                {{ cat.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>

        <button class="button is-primary">Guardar cambios</button>
    </form>
</div>
{% endblock %}
